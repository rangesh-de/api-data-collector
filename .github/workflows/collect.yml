# Runs the collector every day on GitHub's servers, so your computer doesn't need to be on.
# The database is carried from one run to the next as a workflow artifact.
name: Daily collection

on:
  schedule:
    - cron: "17 13 * * *"      # 13:17 UTC daily (about 8am in Iowa)
  workflow_dispatch:            # adds a "Run workflow" button for manual runs

permissions:
  contents: read
  actions: read                 # needed to download the previous run's database

concurrency:
  group: collect                # never run two collections at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database from the previous run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh run download --repo "${{ github.repository }}" --name collector-db --dir data \
            || echo "No previous database found (expected on the first run)"
          ls -la data

      - name: Collect
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m collector run

      - name: Build report
        if: always()
        run: |
          python -m collector report
          cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save database for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-db
          path: data/collector.db
          retention-days: 90
          if-no-files-found: error
